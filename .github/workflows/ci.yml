name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `prisma generate`, which lib/generated/prisma needs
      # (it is gitignored). It reads prisma/schema.prisma only — no database.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Hermetic by design: scripts/test-env.mjs pins a placeholder DATABASE_URL
      # so no test can reach a real database. See that file before adding any
      # test that needs one.
      - name: Test
        run: npm test

      - name: Thai encoding guard
        run: npm run check:mojibake

# `next build` is deliberately not run here. The storefront pages are statically
# generated (`export const revalidate`), so a build queries the production
# database — which CI should not have credentials for. Vercel already builds
# every push and every pull request, and that deployment is the build gate.
