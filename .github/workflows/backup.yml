name: Weekly Backup

# Runs on GitHub's own runner, so nothing needs to stay powered on locally.
#
#  - schedule        : every Monday 02:00 Asia/Bangkok (19:00 UTC Sunday)
#  - workflow_dispatch: the one-click button in Backup Center posts here
#
# Artifacts land on Google Drive via rclone — a different provider from both
# Supabase (database) and Vercel Blob (images), which is the whole point of a
# backup. See docs/backup-automation-runbook.md for setup and restore steps.

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

# Two backups running at once would fight over the Drive state file.
concurrency:
  group: weekly-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_MAJOR: "17"
  WORK_DIR: ${{ github.workspace }}/backup-work

jobs:
  backup:
    runs-on: ubuntu-latest
    # The first Blob mirror can take more than two hours with a shared Drive
    # client. GitHub-hosted jobs allow six hours; incremental runs are shorter.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ubuntu ships pg_dump 16; Supabase may run 17. pg_dump refuses to dump a
      # server newer than itself, so pull the exact major from the official PGDG
      # repository rather than trusting the distro version.
      - name: Install PostgreSQL client and rclone
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}" rclone
          PG_BIN="/usr/lib/postgresql/${PG_MAJOR}/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/pg_dump" --version
          "$PG_BIN/pg_restore" --version
          if ! "$PG_BIN/pg_dump" --version | grep -q "PostgreSQL) ${PG_MAJOR}\."; then
            echo "::error::Expected pg_dump major ${PG_MAJOR}."
            exit 1
          fi
          rclone version | head -n 1

      - name: Configure rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_BASE64:-}" ]; then
            echo "::error::RCLONE_CONFIG_BASE64 is not configured."
            exit 1
          fi
          if [ -z "${RCLONE_REMOTE:-}" ]; then
            echo "::error::RCLONE_REMOTE is not configured."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          REMOTE_NAME="${RCLONE_REMOTE%%:*}:"
          if ! rclone listremotes | grep -Fxq "$REMOTE_NAME"; then
            echo "::error::Configured rclone remote $REMOTE_NAME was not found."
            exit 1
          fi

      - name: Resolve backup date (Asia/Bangkok)
        id: meta
        run: echo "date=$(TZ=Asia/Bangkok date +%F)" >> "$GITHUB_OUTPUT"

      # A SELECT-only role does NOT bypass row-level security by default. Allow
      # RLS-enabled tables only when the connected role explicitly has BYPASSRLS;
      # otherwise pg_dump could silently contain a filtered subset of production.
      - name: Guard against RLS-filtered dumps
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo "::error::BACKUP_DATABASE_URL is not configured."
            exit 1
          fi
          ROLE_BYPASSRLS=$(psql "$PGURL" -At -c "
            select rolbypassrls
            from pg_roles
            where rolname = current_user;
          ")
          RLS_TABLES=$(psql "$PGURL" -At -c "
            select string_agg(c.relname, ', ' order by c.relname)
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity;
          ")
          if [ -n "$RLS_TABLES" ] && [ "$ROLE_BYPASSRLS" != "t" ]; then
            echo "::error::Row-level security is enabled on: $RLS_TABLES"
            echo "::error::The backup role would dump a filtered subset of these tables."
            echo "::error::Grant BYPASSRLS to the backup role, or disable RLS. See docs/backup-automation-runbook.md."
            exit 1
          fi
          if [ -n "$RLS_TABLES" ]; then
            echo "RLS is enabled in public and current_user has BYPASSRLS — dump will be complete."
          else
            echo "No RLS-enabled tables in public — dump will be complete."
          fi

      - name: Dump PostgreSQL
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/db"
          DUMP="$WORK_DIR/db/postgres-${{ steps.meta.outputs.date }}.dump"
          pg_dump --format=custom --no-owner --no-acl --schema=public --file="$DUMP" "$PGURL"

          # An unreadable dump is worse than no dump, because it looks like success.
          pg_restore --list "$DUMP" > /dev/null
          SIZE=$(stat -c %s "$DUMP")
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Dump is only ${SIZE} bytes — refusing to treat this as a valid backup."
            exit 1
          fi
          echo "DUMP_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Fetch previous blob index from Drive
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/state"
          # Absent on the very first run — that is not an error, it just means a full sync.
          rclone copy "$RCLONE_REMOTE/state/blob-index.json" "$WORK_DIR/state/" || true

      - name: Sync Vercel Blob incrementally
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is not configured."
            exit 1
          fi
          npx tsx scripts/backup-blob-sync.ts \
            --work-dir "$WORK_DIR" \
            --state "$WORK_DIR/state/blob-index.json" \
            --date "${{ steps.meta.outputs.date }}"

      - name: Write report
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          REPORT="$WORK_DIR/REPORT-${{ steps.meta.outputs.date }}.txt"
          {
            echo "Autoparts backup ${{ steps.meta.outputs.date }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "trigger: ${{ github.event_name }}"
            echo
            echo "postgres dump bytes: ${DUMP_SIZE}"
            echo "blob summary:"
            cat "$WORK_DIR/blob-summary.json"
            echo
            echo "approximate row counts (pg_stat_user_tables.n_live_tup):"
            psql "$PGURL" -At -F$'\t' -c "
              select relname, n_live_tup
              from pg_stat_user_tables
              where schemaname = 'public'
              order by n_live_tup desc;
            "
          } > "$REPORT"
          cat "$REPORT"

      # Upload order matters. Persist the small database dump and report before
      # the potentially long first Blob mirror. The state file must remain last:
      # it records that every indexed Blob object is safely on Drive.
      - name: Upload to Google Drive
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          set -euo pipefail
          RCLONE_OPTS="--transfers 8 --checkers 16 --retries 3 --stats 30s --stats-one-line --stats-log-level NOTICE"
          rclone copy "$WORK_DIR/db" "$RCLONE_REMOTE/db" $RCLONE_OPTS
          rclone copy "$WORK_DIR/REPORT-${{ steps.meta.outputs.date }}.txt" "$RCLONE_REMOTE/reports" $RCLONE_OPTS
          rclone copy "$WORK_DIR/blob-mirror" "$RCLONE_REMOTE/blob-mirror" $RCLONE_OPTS
          rclone copy "$WORK_DIR/state/blob-index.json" "$RCLONE_REMOTE/state" $RCLONE_OPTS

      # Dumps and reports age out after ~12 weeks. blob-mirror is never pruned:
      # it is the only copy of images deleted from production.
      - name: Apply retention
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          set -euo pipefail
          rclone delete "$RCLONE_REMOTE/db" --min-age 90d
          rclone delete "$RCLONE_REMOTE/reports" --min-age 90d

      # Runs even when an earlier step failed — a silent backup failure is the
      # failure mode this whole workflow exists to prevent.
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_IDS:-}" ]; then
            echo "Telegram not configured — skipping notification."
            exit 0
          fi

          # printf, not a multi-line string literal: YAML block indentation would
          # otherwise end up as leading spaces inside the Telegram message.
          if [ "$JOB_STATUS" = "success" ]; then
            TOTAL=$(jq -r '.totalFiles' "$WORK_DIR/blob-summary.json" 2>/dev/null || echo "?")
            CHANGED=$(jq -r '.changedFiles' "$WORK_DIR/blob-summary.json" 2>/dev/null || echo "?")
            TEXT=$(printf '✅ Backup สำเร็จ %s\nฐานข้อมูล: %s bytes\nไฟล์ทั้งหมด: %s รายการ\nอัปโหลดรอบนี้: %s ไฟล์\nเก็บที่ Google Drive เรียบร้อย\n%s' \
              "$BACKUP_DATE" "${DUMP_SIZE:-0}" "$TOTAL" "$CHANGED" "$RUN_URL")
          else
            TEXT=$(printf '❌ Backup ล้มเหลว %s\nสถานะ: %s\nกรุณาเปิดดู log แล้วสั่งรันใหม่\n%s' \
              "$BACKUP_DATE" "$JOB_STATUS" "$RUN_URL")
          fi

          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_IDS"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            CHAT_ID=$(echo "$CHAT_ID" | tr -d '[:space:]')
            # `[ ... ] && continue` would abort the step under `set -e` whenever
            # the test is false, which is the common case.
            if [ -z "$CHAT_ID" ]; then continue; fi
            curl -sS -o /dev/null -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "disable_web_page_preview=true" || true
          done
